</header>

<main>
  <div class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Accueil</a> / Boutique</div>
      <h1>La boutique iPad Queen</h1>
      <p>Filtrez par catégorie, budget ou recherchez un modèle précis.</p>
    </div>
  </div>

  <section class="section" style="padding-top:50px;">
    <div class="container">

      <div class="filter-group reveal in" style="margin-bottom:20px;">
        <button class="chip-btn active" data-filter-cat="all">Tout</button>
        <button class="chip-btn" data-filter-cat="pro">iPad Pro</button>
        <button class="chip-btn" data-filter-cat="air">iPad Air</button>
        <button class="chip-btn" data-filter-cat="mini">iPad Mini</button>
        <button class="chip-btn" data-filter-cat="classic">iPad Classique</button>
        <button class="chip-btn" data-filter-cat="accessories">Accessoires</button>
      </div>

      <div class="toolbar reveal in">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input id="search-input" type="text" placeholder="Rechercher un iPad, une couleur, un accessoire…">
        </div>
        <select id="sort-select" class="select-pill">
          <option value="newest">Trier : Nouveautés</option>
          <option value="price-asc">Prix croissant</option>
          <option value="price-desc">Prix décroissant</option>
          <option value="popularity">Popularité</option>
        </select>
        <div style="display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--ink-soft);">
          Budget max
          <input type="range" id="price-max" min="4000" max="320000" step="2000" value="320000" style="accent-color:var(--rose-gold-2);">
          <span id="price-max-out">320 000 DA</span>
        </div>
      </div>

      <p style="font-size:14px;color:var(--ink-soft);margin-bottom:20px;"><span id="result-count">0</span> iPad(s) trouvé(s)</p>

      <div class="grid-products" id="all-products-grid"></div>

      <div id="recent-section" style="margin-top:80px;">
        <div class="section-head" style="margin-bottom:30px;text-align:left;max-width:none;">
          <h2 style="font-size:24px;">Vus récemment</h2>
        </div>
        <div class="grid-products" id="recent-grid"></div>
      </div>

    </div>
  </section>
</main>
